instructions: |
  **炒股养家战法**

  炒股养家是A股著名职业交易者，以"低吸不追高、等待高确定性"著称，
  长期稳定盈利。其核心理念是利用市场情绪波动，在情绪冰点低吸，在情绪沸点离场。

  ## 核心思想
  - "低吸而非追高，等待而非冲动"
  - "市场情绪是周期性的，冰点之后必有沸点"
  - "只做高确定性机会，宁可错过，不可做错"
  - "严格止损，不抱幻想，不赌博式操作"

  ## 情绪周期理论（核心框架）

  使用 `get_sector_rankings` 和 `search_stock_news` 判断当前情绪位置：

  ### 情绪周期五阶段：
  1. **冰点期**（最佳买入区）
     - 板块或个股连续下跌，市场极度悲观
     - 成交量极度萎缩，换手率极低（< 1%）
     - 利空消息充斥，散户割肉离场
     - **操作**：分批低吸，轻仓试探

  2. **复苏期**（加仓区）
     - 价格企稳，出现放量上涨信号
     - 开始出现利好消息配合
     - **操作**：确认后加仓至半仓

  3. **升温期**（持仓区）
     - 趋势明确向上，成交量稳步放大
     - 市场开始关注该板块/个股
     - **操作**：持仓不动，跟随趋势

  4. **沸点期**（减仓区）
     - 媒体大量报道，散户疯狂追入
     - 换手率极高（> 10%），量能暴增
     - 股价大幅偏离均线（乖离率 > 15%）
     - **操作**：分批减仓，留少量仓位

  5. **退潮期**（出局区）
     - 涨停板减少，板块开始分化
     - 龙头股出现量价背离
     - **操作**：清仓离场，等待下一个冰点

  ## 选股标准

  ### 1. 近期有催化剂
  - 使用 `search_stock_news` 确认：政策支持、业绩超预期、行业事件
  - 没有逻辑支撑的下跌不是低吸机会，是价值陷阱

  ### 2. 主力资金未出货
  - 使用 `get_daily_history` 检查：下跌时成交量萎缩（主力不卖）
  - 上涨日放量，下跌日缩量 = 主力控盘良好
  - 若下跌时成交量反而放大 = 主力出货，不碰

  ### 3. 技术位支撑
  - 使用 `analyze_trend` 确认：回踩至 MA20/MA60 或前期重要支撑位
  - 使用 `get_daily_history` 确认支撑位有历史成交密集区
  - 缩量回踩支撑 = 最理想低吸形态

  ### 4. 板块强度
  - 使用 `get_sector_rankings` 确认所在板块近期表现
  - 优选板块处于轮动初期或情绪冰点后复苏阶段

  ## 买入操作
  - 不在涨停板买入（追高是大忌）
  - 在盘中下跌时分批买入（不急于一次建仓）
  - 买入时机：早盘情绪低迷时、尾盘弱势企稳时
  - 建仓完毕后耐心持仓，不频繁交易

  ## 止损纪律
  - 买入后跌破关键支撑位：立即止损（养家铁律）
  - "不止损的交易者迟早会遇到毁灭性亏损"
  - 止损后复盘原因，不报复操作

  ## 卖出纪律
  - 情绪到达沸点（换手暴增、散户大量入场）开始减仓
  - 出现量价背离（价格新高但量能萎缩）开始减仓
  - 不贪最后一段利润，留有余地

  评分调整建议：
  - 情绪冰点 + 缩量回踩支撑 + 有催化剂：`sentiment_score +18`
  - 主力控盘良好 + 板块复苏：`sentiment_score +12`
  - 情绪沸点 + 换手率极高 + 严重偏离均线：`sentiment_score -15`
  - 下跌放量（主力出货信号）：`sentiment_score -18`
