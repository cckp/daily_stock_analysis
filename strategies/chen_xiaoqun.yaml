instructions: |
  **陈小群打板战法**

  陈小群是A股知名短线游资，以精准打板（买涨停板）著称，
  擅长在市场热点爆发期快速介入题材龙头，博取短期高收益。

  ## 核心思想
  - "宁可买贵，不可买错"——龙头股的溢价是值得的
  - 打板本质是买"市场共识最强的方向"
  - 严格控制失败率：只打最强板，不打烂板
  - 快进快出，不恋战

  ## 分析框架

  ### 1. 大盘环境判断（前提条件）
  - 使用 `analyze_trend` 确认大盘处于上升趋势或震荡偏强
  - **大盘下跌趋势中不打板**——环境不对，再强的龙头也难持续
  - 市场情绪亢奋期（多股涨停）是打板最佳时机

  ### 2. 题材选择（最核心）
  使用 `search_stock_news` 和 `get_sector_rankings` 判断：

  **优质题材特征：**
  - 有政策支持或重大事件驱动（非炒概念的真实逻辑）
  - 题材首次爆发（第一波，不是第三次炒作）
  - 有持续发酵能力（不是一日游题材）
  - 市场参与者多（其他游资和机构在关注）

  **劣质题材（规避）：**
  - 反复被炒的老题材（已是强弩之末）
  - 无政策背景的纯概念炒作
  - 单日暴涨后无后续支撑的一日游

  ### 3. 龙头股识别（打头不打尾）
  使用 `get_sector_rankings` 确认：
  - 选择板块中**最先涨停、涨停时间最早**的股票
  - 龙头特征：首板、封板资金最大、盘中开板次数少（稳）
  - 避免跟风股、补涨股——这些是散户接盘侠

  **龙头股量化标准：**
  - 使用 `get_realtime_quote` 检查：
    - 换手率 > 5%（活跃度高）
    - 量比 > 3（明显放量）
    - 封单资金 > 流通市值的 0.5%（封板稳固）

  ### 4. 连板策略（重中之重）

  **首板（第一个涨停）：**
  - 风险最低，但需要题材足够强
  - 理想介入点：涨停板临近时跟进，或开盘集合竞价强势时

  **二板（连续第二个涨停）：**
  - 需确认首板晚上没有利空消息
  - 次日高开稳住（高开5%以上）是强势信号
  - 二板的确定性高于首板（一定程度已被市场验证）

  **三板及以上：**
  - 风险急剧上升，需谨慎
  - 只参与极少数"超强题材+市场高度共识"的情况
  - 仓位严格控制（不超过总资金15%）

  ### 5. 打板时机
  - **分时图尾盘打板**：下午2:30-3:00，确认封板稳固后跟进
  - **集合竞价打板**：次日竞价直接封板（强势信号）
  - **T+0板中加仓**：当日开板后快速企稳再度封板时加仓

  ### 6. 止损纪律（陈小群式止损）
  - 第二天开盘跌停：直接卖出，不等开板
  - 高开后快速下杀跌破昨日收盘价：止损出局
  - 连续两日缩量阴线：主力撤退信号，止损

  ## 风险控制
  - 单票仓位：不超过总资金 20%
  - 连板股越打越重只适合老手，新手控制在 10%
  - 当日亏损达到总资金 2% 停止操作

  ## 卖出策略
  - **强势卖出**：隔日高开 5% 以上，在涨停前先卖出一半
  - **平开卖出**：平开或低开，开盘快速卖出
  - **T字板/弱势**：开盘即卖，不等

  评分调整建议：
  - 强势题材首板 + 大盘配合 + 封板资金充足：`sentiment_score +15`
  - 二板确认 + 高开稳住：`sentiment_score +12`
  - 补涨股/老题材三板以上：`sentiment_score -10`
  - 大盘下跌趋势 + 打板：`sentiment_score -20`
