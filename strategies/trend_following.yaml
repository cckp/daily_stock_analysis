instructions: |
  **趋势跟踪交易系统（Trend Following / 海龟法则）**

  来源：理查德·丹尼斯"海龟交易实验"，核心思想：趋势是市场中最可利用的规律，
  纪律执行比预测方向更重要。

  ## 核心原则
  1. 不预测顶底，只跟随已确认的趋势
  2. 小亏大赚：单次止损严格，让盈利充分延伸
  3. 分散持仓，控制每笔风险不超过总资金 1-2%
  4. 突破入场，回撤止损

  ## 分析框架

  ### 1. 趋势判断
  - 使用 `get_daily_history` 获取近 60 日数据
  - 使用 `analyze_trend` 计算 MA20/MA60 方向
  - **上升趋势**：MA20 > MA60，价格在 MA20 上方，MA60 斜率向上
  - **下降趋势**：MA20 < MA60，价格在 MA20 下方

  ### 2. 入场信号（突破系统）
  - **20日突破**：价格突破近20日最高收盘价（短线系统）
  - **55日突破**：价格突破近55日最高收盘价（长线系统）
  - 突破当日成交量放大 > 均量 120% 为有效突破
  - 使用 `get_realtime_quote` 确认实时量能

  ### 3. 仓位管理（ATR头寸控制）
  - ATR（真实波幅均值）= 近14日最高-最低的均值
  - 单笔仓位 = 账户资金 × 1% ÷ ATR
  - 确保单次止损不超过总资金 1%

  ### 4. 止损设置
  - 短线系统：止损于近10日最低价下方
  - 长线系统：止损于近20日最低价下方
  - 趋势反转（价格有效跌破 MA20）：立即止损出局

  ### 5. 加仓规则
  - 第一次突破入场后，每上涨 0.5 个 ATR 可加仓一次
  - 最多加仓4次，形成金字塔式建仓
  - 每次加仓同步上移止损价

  ### 6. 出场规则
  - 短线系统：跌破近10日最低价出场
  - 长线系统：跌破近20日最低价出场
  - 不设固定止盈，让趋势决定何时出场

  ## A股适配说明
  - A股涨跌停板机制，突破涨停日次日可视为有效突破确认日
  - 日线级别趋势跟踪适合持仓 10-60 个交易日
  - 板块轮动特征明显，需结合板块强度判断

  评分调整建议：
  - 价格突破55日高点 + 放量：`sentiment_score +15`
  - 价格突破20日高点 + MA均线多头：`sentiment_score +10`
  - 趋势强劲（MA60持续上行）：额外 `+5`
  - 价格跌破 MA20 或止损线：`sentiment_score -15`
