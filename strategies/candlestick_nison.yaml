instructions: |
  **日本蜡烛图技术（Japanese Candlestick Techniques）**

  来源：史蒂夫·尼森《日本蜡烛图技术》，日本300年蜡烛图智慧的集大成之作。

  ## 核心思想
  K线不仅是价格数据，更是市场心理的直接体现。
  形态 = 多空力量的博弈结果，单根K线或组合形态可预判短期方向。

  ## 分析框架

  使用 `get_daily_history` 获取近30日K线数据进行以下形态分析：

  ### 1. 反转信号（见底/见顶）

  **看涨反转形态（在下跌趋势末端出现）：**
  - **锤子线**：下影线 ≥ 实体2倍，上影线极短，实体在上方 → 强烈看涨
  - **启明星**：阴线 + 小实体跳空低开 + 大阳线，三日组合 → 底部反转
  - **穿刺形态**：阴线后阳线低开，收盘超过前日阴线实体中点 → 看涨
  - **早晨之星**：类似启明星，中间K线为十字星更为强烈
  - **吞没形态（看涨）**：阳线实体完全吞没前日阴线实体

  **看跌反转形态（在上升趋势末端出现）：**
  - **流星线**：上影线 ≥ 实体2倍，下影线极短，实体在下方 → 强烈看跌
  - **黄昏星**：阳线 + 小实体跳空高开 + 大阴线，三日组合 → 顶部反转
  - **乌云盖顶**：阳线后阴线高开，收盘超过前日阳线实体中点 → 看跌
  - **吊颈线**：上涨趋势中出现锤子形状（与下跌趋势中的锤子位置相反）
  - **吞没形态（看跌）**：阴线实体完全吞没前日阳线实体

  ### 2. 延续信号（趋势持续）
  - **上升三法**：上涨趋势中，大阳线 + 3根小阴线回调 + 再创新高大阳线
  - **下降三法**：下跌趋势中，大阴线 + 3根小阳线反弹 + 再创新低大阴线
  - **跳空缺口**：顺势跳空缺口 = 趋势加速信号，逆势跳空缺口 = 反转信号

  ### 3. 中性信号（方向待定）
  - **十字星**：开收价相同，多空均衡 → 结合前后K线判断
  - **纺锤线**：小实体 + 较长影线 → 犹豫不决，等待确认

  ### 4. 形态有效性验证
  - 使用 `analyze_trend` 确认大趋势背景（顺势形态更可靠）
  - 使用 `get_realtime_quote` 确认量能配合（反转形态需放量确认）
  - 在关键支撑/阻力位出现的形态可信度更高
  - 单根K线参考价值低于组合形态

  ### 5. A股K线特殊说明
  - A股涨跌停板导致的"一字板"K线：涨停一字 = 极强买盘，跌停一字 = 极弱走势
  - 连续涨停后的第一根带影线K线需重点关注（可能是顶部）
  - 大阳线吃掉多根阴线（光头光脚大阳线）= 主力入场信号

  ## 综合研判
  1. 先判断大趋势（上升/下降/震荡）
  2. 在趋势关键位置寻找反转形态
  3. 等待次日K线确认（防止假信号）
  4. 量能配合才入场

  评分调整建议：
  - 底部出现强烈看涨反转形态 + 放量确认：`sentiment_score +13`
  - 上升趋势中出现延续形态：`sentiment_score +8`
  - 顶部出现看跌反转形态：`sentiment_score -13`
  - 十字星 + 量能萎缩（方向不明）：`sentiment_score 维持基准`
