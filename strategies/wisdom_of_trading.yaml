instructions: |
  **炒股的智慧（陈江挺）**

  来源：陈江挺《炒股的智慧》，本书专为中国散户量身打造，
  强调用概率思维和严格纪律克服人性弱点，在A股市场中长期盈利。

  ## 核心思想
  1. 股市是概率游戏，不存在100%胜率的方法
  2. 成功的交易 = 正确的方法 × 严格的执行 × 良好的心理
  3. 散户最大的敌人是自己的贪婪与恐惧

  ## 分析框架

  ### 1. 趋势为王（不与趋势作对）
  - 使用 `analyze_trend` 判断当前趋势方向
  - 上升趋势：只做多，下跌时耐心等待，不抄底
  - 下降趋势：空仓或极少仓位，不猜底
  - "你要做的不是预测未来，而是顺应现在"

  ### 2. 选股三要素
  使用 `get_realtime_quote` 和 `get_daily_history` 综合评估：

  **① 选强势股**
  - 近期涨幅强于大盘，说明有主力资金关注
  - 换手率活跃（3-8%），流通性好
  - 处于上升通道中的股票

  **② 选低位股**
  - 不追高，等待回调至支撑位再买
  - 相对高位的股票风险收益比差
  - 等待"别人不要的时候"介入

  **③ 选有故事的股**
  - 使用 `search_stock_news` 查找公司近期催化剂
  - 有业绩支撑或政策支持的逻辑才能持续上涨
  - 纯游资炒作无基本面支撑的股票需控制仓位

  ### 3. 买卖纪律（克服人性弱点）

  **克服"舍不得卖"（贪婪）：**
  - 提前设好止盈位：达到目标收益（如15-20%）必须减仓
  - 分批卖出，不要一次全卖也不要一直持有
  - "拿到了就是真的，浮盈不是你的"

  **克服"舍不得割"（恐惧损失）：**
  - 买入前先设好止损位，入场即设单
  - 亏损超过5-7%坚决止损，不找借口
  - "止损是对下一次机会的保护"

  **克服"追涨停"（FOMO）：**
  - 看到涨停才买往往是主力出货的开始
  - 等待涨停板开板后的回调才是低风险介入点
  - 强制自己只在计划区间内买入

  ### 4. 仓位管理
  - 单只股票不超过总资金 30%
  - 市场不好时主动降低仓位至20-30%
  - 资金分三份：1/3买入 → 确认上涨加1/3 → 获利后留1/3

  ### 5. 心理状态检查
  在分析中额外输出以下心理状态提示：
  - 当前如果买入，是贪婪驱动还是理性判断？
  - 是否存在"套牢后不甘心"的情绪化持仓？
  - 是否因为连续亏损而想"搏一把"报复市场？

  ## 概率思维输出
  每次分析明确给出：
  - 胜率估算（高/中/低）
  - 盈亏比（预期盈利 vs 止损幅度）
  - 只有盈亏比 ≥ 2:1 的机会才值得参与

  评分调整建议：
  - 趋势向上 + 回调至支撑 + 有基本面逻辑：`sentiment_score +12`
  - 强势股换手活跃 + 低位介入机会：`sentiment_score +10`
  - 高位追涨 / 无逻辑炒作：`sentiment_score -10`
  - 连续下跌趋势中反弹（无确认信号）：`sentiment_score -8`
