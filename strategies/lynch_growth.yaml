instructions: |
  **彼得·林奇成长股投资法**

  来源：彼得·林奇《彼得·林奇的成功投资》《战胜华尔街》
  林奇管理麦哲伦基金13年，年均回报29%。核心：发现机构未覆盖的"身边的好公司"。

  ## 核心思想
  - "买你所知道的"：从日常生活中发现投资机会
  - 最好的股票往往是业绩持续增长但机构尚未大量覆盖的中小盘股
  - 不同类型的股票用不同的持仓策略

  ## 林奇股票六分类

  使用 `search_stock_news` 和基本面数据判断股票属于哪类：

  1. **缓慢增长股**（大型稳定公司）：年增速 < 10%，主要靠分红，不是主要目标
  2. **稳定增长股**（消费/医药龙头）：年增速 10-20%，熊市避风港，合理估值买入
  3. **快速增长股（核心目标）**：年增速 > 20%，空间大，这类股可成十倍股
  4. **周期股**：跟随行业周期，需要在谷底买入（PE高时反而是低点）
  5. **困境反转股**：公司遇到暂时困难，基本面将改善
  6. **隐蔽资产股**：账面价值被严重低估（土地、品牌、资源）

  ## 核心分析维度

  ### 1. 寻找"快速增长股"特征
  - 净利润增速：连续3年 ≥ 20%，且增速本身在加速
  - 所在行业尚处于扩张早中期（市场渗透率 < 30%）
  - 可复制的商业模式（连锁扩张、区域扩张）
  - 使用 `search_stock_news` 查询公司扩张计划和门店/产能数据

  ### 2. PEG估值（林奇最重要的指标）
  - 使用 `get_realtime_quote` 获取当前 PE
  - PEG = PE ÷ 净利润增速（%）
  - **PEG < 0.5**：严重低估，极具吸引力
  - **PEG 0.5-1.0**：合理低估，可以买入
  - **PEG > 1.5**：高估，需谨慎
  - **PEG > 2**：过于昂贵，等待回调

  ### 3. 机构关注度（反向指标）
  - 林奇喜欢机构持仓低（< 20%）的公司——还未被发现
  - 机构一致推荐、满仓的股票往往已经"定价充分"
  - 使用 `search_stock_news` 查看分析师覆盖数量

  ### 4. 财务健康
  - 现金 > 债务，或债务可控（资产负债率 < 50%）
  - 存货/应收账款增速不超过营收增速（警惕通过信用扩张的虚假增长）
  - 毛利率稳定或持续提升（定价权的体现）

  ### 5. 技术面配合
  - 使用 `get_daily_history` 确认股价未大幅偏离均线
  - 使用 `analyze_trend` 确认中期趋势向上或处于整理阶段
  - 在合理估值区间时分批买入，不追高

  ## 林奇的持仓建议
  - 快速增长股：重仓（30-50%），持有1-3年
  - 困境反转股：轻仓（10-15%），成功则大赚，失败损失有限
  - 周期股：需要择时，谷底重仓，景气顶减仓

  ## 卖出信号
  - PEG 持续超过 1.5，且增速开始放缓
  - 公司扩张出现问题（异地复制失败、毛利率下滑）
  - 有更好的 PEG 更低的机会

  评分调整建议：
  - PEG < 0.8 + 增速加速 + 机构覆盖少：`sentiment_score +15`
  - PEG 0.8-1.2 + 行业扩张期：`sentiment_score +10`
  - 增速开始下滑 + PEG > 1.5：`sentiment_score -12`
  - 财务造假风险信号（存货/应收猛增）：`sentiment_score -20`
