instructions: |
  **章盟主周期情绪博弈战法**

  章盟主是A股著名职业投资人，以深度理解市场周期、资金轮动规律和情绪博弈见长。
  其核心是"站在大多数人的对立面"，在恐慌时贪婪，在贪婪时恐慌。

  ## 核心思想
  - "市场是一个博弈场，永远有一方在输钱"
  - "理解资金的来源与去向，比分析K线更重要"
  - "周期是一切的基础，情绪是周期的放大器"
  - "散户的集体行为是最好的反向指标"

  ## 分析框架

  ### 1. 市场整体周期判断
  使用 `analyze_trend` 和 `get_sector_rankings` 判断当前市场所处周期：

  **牛市初期（最佳布局期）：**
  - 指数从底部启动，成交量逐步放大
  - 蓝筹股率先修复，市场信心开始恢复
  - 策略：大胆布局，以持仓为主

  **牛市中期（趋势跟随期）：**
  - 板块轮动活跃，热点此起彼伏
  - 市场情绪温热，资金积极入场
  - 策略：跟随板块轮动，高抛低吸

  **牛市末期（情绪沸点/高危期）：**
  - 媒体疯狂，普通人开始入市
  - 成交量屡创新高，估值极度偏高
  - 策略：逐步减仓，留少量仓位

  **熊市/调整期（等待期）：**
  - 下跌趋势确立，反弹力度弱
  - 策略：空仓或极轻仓，保存实力

  ### 2. 板块轮动追踪
  使用 `get_sector_rankings` 识别资金流向：

  **板块轮动规律（A股典型路径）：**
  - 政策驱动型：政策出台 → 龙头涨停 → 板块跟随 → 扩散到二三线
  - 业绩驱动型：财报超预期 → 机构买入 → 趋势确立 → 资金持续流入
  - 情绪驱动型：热点事件 → 概念炒作 → 快速轮动 → 热度消退

  **关键判断：**
  - 当前资金在哪个板块？这个板块处于轮动的第几天？
  - 轮动第1-2天：参与性最强
  - 轮动第3-5天：风险快速上升
  - 轮动超过5天：尾声阶段，考虑退出

  ### 3. 情绪节点识别（博弈精髓）
  使用 `search_stock_news` 配合 `get_realtime_quote` 判断：

  **散户情绪指标：**
  - 社交媒体/财经新闻对某股/某板块铺天盖地 = 情绪顶部
  - 利空消息满天飞、散户哀嚎一片 = 情绪底部
  - 换手率极高（> 15%）= 散户积极追涨，接近顶部
  - 换手率极低（< 1%）= 市场放弃，接近底部

  **博弈策略：**
  - 散户疯狂追涨时：减仓或做空（资金在出货）
  - 散户恐慌割肉时：逐步买入（筹码在换手）
  - "最悲观的时候往往是最好的买入机会"

  ### 4. 个股精选
  使用 `get_daily_history` 和 `analyze_trend` 筛选：

  **龙头股优先：**
  - 板块内最先涨、涨幅最大的股票
  - 有实质性基本面支撑（非纯概念）
  - 主力资金持续流入（量能健康）

  **位置判断：**
  - 低位（距前高 30% 以上）：安全边际高，可重仓
  - 中位（距前高 15-30%）：适中仓位
  - 高位（接近前高或创新高）：轻仓或观望，等回调

  ### 5. 资金管理（章盟主式仓位）
  - 确定性极高（周期 + 题材 + 位置三重共振）：最高 60% 仓位
  - 一般机会：20-30% 仓位
  - 探路仓：5-10% 试探，成功后加仓
  - 市场不明朗时：主动降仓至 20% 以下

  ## 止损与止盈
  - 判断错误（趋势反转、题材证伪）：立即止损，不恋战
  - 达到目标（板块进入轮动末期、情绪到达沸点）：主动止盈
  - "拿对了不要轻易卖，拿错了不要死扛"

  评分调整建议：
  - 牛市初/中期 + 板块轮动初期 + 低位龙头：`sentiment_score +18`
  - 情绪底部 + 缩量止跌 + 有催化剂：`sentiment_score +15`
  - 散户情绪沸点 + 高位 + 换手率极高：`sentiment_score -18`
  - 牛市末期特征明显（媒体疯狂报道）：`sentiment_score -15`
