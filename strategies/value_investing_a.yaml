instructions: |
  **价值投资 A股适配版**

  来源：格雷厄姆《聪明的投资者》+ 巴菲特投资体系，结合A股周期与估值特征。

  ## 核心思想
  - 买入好公司，而非预测股价
  - 安全边际：以低于内在价值的价格买入
  - 市场先生：利用市场情绪波动，而非被情绪驱动

  ## 分析框架

  ### 1. 企业质量筛选（护城河）
  使用 `search_stock_news` 查询以下信息：
  - **ROE（净资产收益率）**：近3年平均 ≥ 15%，且稳定（非一次性）
  - **净利润增速**：近3年年均 ≥ 10%，无大幅波动
  - **负债率**：资产负债率 ≤ 60%（金融企业除外）
  - **现金流**：经营性现金流持续为正，且 ≥ 净利润 80%
  - **行业地位**：细分行业前三，具备定价权或品牌壁垒

  ### 2. 估值评估（安全边际）
  使用 `get_realtime_quote` 获取当前 PE/PB：
  - **PE估值**：当前 PE < 历史均值 × 0.8（横向低估）
  - **PB估值**：PB < 行业均值（尤其适用于银行/地产）
  - **PEG**：PE ÷ 净利润增速 < 1 为低估
  - A股优质消费/医药：PE < 25 倍可考虑，< 20 倍明显低估

  ### 3. 技术面择时（价值+时机）
  - 使用 `get_daily_history` 确认股价处于阶段低位
  - 使用 `analyze_trend` 确认 MA60 方向，趋势未明显向下
  - 下跌至关键支撑位（前期低点/MA120/年线）附近分批介入
  - 避免在股价大幅上涨后以"价值"为由追高

  ### 4. 催化剂识别
  使用 `search_stock_news` 搜索：
  - 行业政策支持或困境反转信号
  - 公司增持/回购公告（管理层对低估的确认）
  - 机构调研密集（机构也在寻找价值机会）

  ### 5. A股特殊注意事项
  - A股商誉减值风险：并购后商誉 > 净资产 30% 需警惕
  - 周期股估值：PE高时反而是低点（困境期），PE低时反而是高点（景气顶）
  - 国企特殊性：部分国企长期低估，需有耐心或等待催化剂

  ## 买入策略
  - 分3批建仓：初始仓位30%，每下跌5-10%加仓
  - 持仓周期：1-3年，不看短期波动

  ## 止损/卖出
  - 基本面恶化（ROE持续下滑、造假、负债率急升）坚决卖出
  - 估值严重高估（PE > 历史均值 × 1.5）考虑减仓
  - 有更好的价值机会时可置换

  评分调整建议：
  - ROE > 15% + PE < 历史均值 × 0.8 + 现金流健康：`sentiment_score +15`
  - 管理层增持 + 阶段低位：`sentiment_score +10`
  - 基本面稳定 + 行业催化剂出现：额外 `+8`
  - 商誉大幅减值 / 现金流恶化：`sentiment_score -20`
