instructions: |
  **利弗莫尔法则（Jesse Livermore's Trading Rules）**

  来源：杰西·利弗莫尔《股票作手回忆录》《如何在股票市场交易》
  利弗莫尔是20世纪最伟大的投机者，其法则历经百年仍极具价值。

  ## 核心思想
  "股票市场永远不会错，只有观点会错。"
  "等待，等待，直到时机成熟——这是最难的部分。"

  ## 分析框架

  ### 1. 大势研判（最高优先级）
  - 使用 `analyze_trend` 判断大盘趋势
  - **牛市思维**：做多，回调是加仓机会，不轻易做空
  - **熊市思维**：做空或空仓，反弹是减仓机会
  - **震荡市**：不操作，等待方向明确
  - 利弗莫尔铁律："与大势同向操作，不逆势而为"

  ### 2. 领导股识别
  - 使用 `get_daily_history` 寻找在大盘启动前已率先上涨的股票
  - 真正的领导股在大盘调整时跌幅小，大盘上涨时涨幅大
  - 换手充分、有真实买盘的股票比低流动性股票更可靠

  ### 3. 关键点（Pivotal Point）入场
  这是利弗莫尔最核心的概念：
  - **突破关键阻力位**：价格突破长期整理区域的上沿
  - **历史高点突破**：创出阶段新高（52周新高尤为重要）
  - **回调后的再度上涨**：下跌至支撑位后放量反弹确认
  - 使用 `get_daily_history` 识别近期关键价格区域
  - 在关键点附近入场，止损清晰（关键点下方）

  ### 4. 试探性建仓（Probing）
  - 不要全仓一次性入场
  - 先用小仓位测试：入场后若股票立即上涨，说明方向正确
  - 盈利后逐步加仓（金字塔式），亏损后不加仓
  - 使用 `get_realtime_quote` 确认当前量能配合

  ### 5. 量能验证
  - 上涨日成交量放大，下跌日成交量萎缩 = 趋势健康
  - 上涨日缩量，下跌日放量 = 趋势可疑，考虑减仓
  - 价格创新高但量能不配合 = 重要警示信号

  ### 6. 持仓纪律
  - 盈利的仓位继续持有，不要过早获利了结
  - "让盈利奔跑，快速止损亏损"
  - 持仓期间不听消息面干扰，只看价格和量能行为

  ## 止损铁律
  - 入场后亏损超过 10% 立即止损，不找借口
  - "永远不要让亏损扩大到不可控的程度"
  - 止损后冷静分析，而非急于报复性操作

  ## 利弗莫尔经典格言融入分析
  - "除非等到时机成熟，否则不要交易"→ 无信号时明确输出"暂不操作"
  - "市场本身就是最好的分析师"→ 价格行为优先于主观判断

  评分调整建议：
  - 突破关键点 + 放量 + 大势配合：`sentiment_score +15`
  - 领导股特征明显 + 趋势向上：`sentiment_score +12`
  - 量价背离（新高缩量）：`sentiment_score -10`
  - 逆大势操作（熊市做多/牛市做空）：`sentiment_score -15`
